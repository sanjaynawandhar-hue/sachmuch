name: Ingest

# Ingestion runs on Actions, not Vercel: these are long jobs and Actions is free
# for a public repo. Jobs write directly to Supabase.
on:
  schedule:
    # 02:30 IST, which is 21:00 UTC the day before.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      budgetMinutes:
        description: 'Minutes to spend claiming jobs'
        required: false
        default: '45'

concurrency:
  # Two runners CAN share the queue safely — claiming uses FOR UPDATE SKIP
  # LOCKED — but overlapping scheduled runs just burn free minutes.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          DATA_GOV_IN_KEY: ${{ secrets.DATA_GOV_IN_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          SACHMUCH_USER_AGENT: 'SachmuchBot/0.1 (https://sachmuch.com; sanjay.nawandhar@gmail.com) github-actions'
          INGEST_BUDGET_MINUTES: ${{ github.event.inputs.budgetMinutes || 45 }}
        run: pnpm --filter @sachmuch/pipeline start
