name: Corpus database diagnostics
on:
  push:
    branches: [codex/sachmuch-expo-ios]
    paths:
      - .github/workflows/corpus-diagnostics.yml
      - pipeline/src/corpus-diagnostics.ts
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read counts and migration readiness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @sachmuch/pipeline exec tsx src/corpus-diagnostics.ts
